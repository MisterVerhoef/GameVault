name: E2E smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browser
        run: |
          npx -y @playwright/test@1.56.0 install --with-deps chromium \
            || (sleep 20 && npx -y @playwright/test@1.56.0 install --with-deps chromium)
      - name: Run smoke tests
        run: |
          set -o pipefail
          npx -y @playwright/test@1.56.0 test 2>&1 | tee e2e-output.log
      - name: Commit test output for diagnosis
        if: always()
        run: |
          git config user.email "ci@example.com"
          git config user.name "ci"
          git add e2e-output.log
          git commit -m "ci: e2e output log [skip ci]" || true
          git push
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
