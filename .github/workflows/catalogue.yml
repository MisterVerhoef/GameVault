name: Catalogue validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - "src/data/**"
      - "src/app/**"
      - "src/components/**"
      - "src/context/**"
      - "scripts/**"
      - "public/catalog/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/catalogue.yml"
  push:
    branches: [main]

jobs:
  sync-igdb:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run catalogue:sync:igdb
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_SOURCE_VERSION: scheduled-${{ github.run_id }}
          IGDB_PAGES: "10"
      - run: |
          if git diff --quiet -- public/catalog/games-index.json public/catalog/search-index.json public/catalog/store-offers.json; then
            echo "Catalogue is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog/games-index.json public/catalog/search-index.json public/catalog/store-offers.json
          if git diff --cached --quiet -- public/catalog/games-index.json; then
            git commit -m "chore: refresh store offers"
          else
            git commit -m "chore: sync catalogue from IGDB"
          fi
          git push origin HEAD:main

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:catalogue
      - run: npm run catalogue:search-index
      - run: git diff --exit-code -- public/catalog/search-index.json
      - run: npx tsc --noEmit
      - run: npx eslint src/data/browse.ts src/data/catalogue.ts src/data/downloadable.ts src/data/platforms.ts src/data/store-match.ts src/data/store-offers.ts src/app/game/[id]/page.tsx src/app/page.tsx src/components/HomeScreen.tsx src/components/GameWall.tsx src/components/GameRow.tsx src/components/description-clamp.ts src/components/GameDescription.tsx src/components/Navbar.tsx scripts test
      - run: npm run build
